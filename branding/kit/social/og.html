<!doctype html><html lang="ko"><meta charset="utf-8"><style>@font-face{font-family:"Pretendard";src:url("../../assets/PretendardVariable.woff2") format("woff2");font-weight:100 900;font-display:block}
*{box-sizing:border-box}html,body{margin:0;background:#f4f5f7}body{font-family:Pretendard,"Malgun Gothic",sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}
.og{width:1200px;height:630px;display:grid;grid-template-columns:1fr 470px;gap:56px;align-items:center;padding:0 72px;background:#f4f5f7;color:#121823}
.l img{width:150px;display:block;margin-bottom:36px}.l h1{margin:0;font-size:64px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.l p{margin:18px 0 0;font-size:26px;font-weight:500;color:#434c5c;line-height:1.45}.l .ind{margin-top:30px;font-size:18px;font-weight:600;color:#434c5c}
.card{background:#ffffff;border-radius:24px;padding:28px 30px;box-shadow:0 18px 50px #0b18331f,0 0 0 1px #dfe2e8;display:grid;gap:14px}
.card .lab{font-size:15px;font-weight:700;color:#434c5c}.card .nm{font-size:30px;font-weight:800}.card .rt{font-size:18px;color:#434c5c}
.trk{position:relative;height:36px;display:block;margin:6px 14px 0}.trk__l,.trk__f{position:absolute;left:0;top:16px;height:5px;border-radius:3px}.trk__l{right:0}

.st{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:#6a7384;margin:0 2px}
.badge{justify-self:start;font-size:18px;font-weight:800;border-radius:999px;padding:5px 14px;border:2px dashed #8a5a00;color:#8a5a00;background:#fdf2dc}</style><div class="og"><div class="l"><img src="../svg/ktr-symbol-light.svg" alt=""><h1>K리그 이적 레이더</h1><p>구단별 이적 소식을<br>출처와 검토 상태와 함께</p><p class="ind">독립 팬 서비스 · 구단·리그 공식 서비스가 아닙니다</p></div>
<div class="card"><span class="lab">예시 · 가상 선수와 가상 소식</span><span class="nm">한도윤</span><span class="rt">구단 B → 구단 A</span><span class="trk"><span class="trk__l" style="background:#dfe2e8"></span><span class="trk__f" style="width:50%;background:repeating-linear-gradient(90deg,#8a5a00 0 8px,transparent 8px 13px)"></span><i style="left:0%;background:#8a5a00;border-color:#8a5a00"></i><i style="left:25%;background:#8a5a00;border-color:#8a5a00"></i><i style="left:50%;background:#8a5a00;border-color:#8a5a00"></i><i style="left:75%;background:#ffffff;border-color:#dfe2e8"></i><i style="left:100%;background:#ffffff;border-color:#dfe2e8"></i><b style="left:50%;background:#8a5a00;box-shadow:0 0 0 6px #8a5a0033"></b></span><span class="st"><span>관심</span><span>접촉</span><span>협상</span><span>임박</span><span>확정</span></span><span class="badge">협상설</span></div></div></html>
