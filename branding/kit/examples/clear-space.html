<!doctype html><html lang="ko"><meta charset="utf-8"><style>@font-face{font-family:"Pretendard";src:url("../../assets/PretendardVariable.woff2") format("woff2");font-weight:100 900;font-display:block}
*{box-sizing:border-box}html,body{margin:0;background:#ffffff}body{font-family:Pretendard,"Malgun Gothic",sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}
.sh{width:1000px;height:420px;background:#ffffff;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;padding:40px;color:#121823}
.box{position:relative;display:grid;place-items:center;background:#f4f5f7;border-radius:12px}
.cs{position:relative;padding:25px;outline:1.5px dashed #6a7384;outline-offset:0}.cs img{display:block;height:64px}
.cs::before{content:"";position:absolute;inset:25px;outline:1px solid #6a738466}
.x{position:absolute;left:0;top:0;width:25px;height:25px;background:#6a738433}
.lbl{position:absolute;left:14px;top:12px;font-size:14px;font-weight:700;color:#434c5c}
.min{display:flex;gap:28px;align-items:flex-end}.min figure{margin:0;display:grid;gap:8px;justify-items:center;font-size:13px;color:#434c5c}</style><div class="sh"><div class="box"><span class="lbl">여백: 로고 둘레에 출발 원 지름(x)만큼</span><div class="cs"><span class="x"></span><img src="../png/ktr-logo-h-light@2x.png" alt=""></div></div>
<div class="box"><span class="lbl">최소 크기</span><div class="min"><figure><img src="../png/ktr-logo-h-light@2x.png" style="height:40px" alt=""><span>가로 로고 높이 40px</span></figure><figure><img src="../svg/ktr-symbol-light.svg" style="height:18px" alt=""><span>심벌 18px</span></figure><figure><img src="../favicon/ktr-favicon.svg" style="height:16px" alt=""><span>파비콘 16px</span></figure></div></div></div></html>
