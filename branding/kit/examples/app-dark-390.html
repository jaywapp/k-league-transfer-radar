<!doctype html><html lang="ko"><meta charset="utf-8"><style>@font-face{font-family:"Pretendard";src:url("../../assets/PretendardVariable.woff2") format("woff2");font-weight:100 900;font-display:block}
*{box-sizing:border-box}html,body{margin:0;background:#0c0f14}body{font-family:Pretendard,"Malgun Gothic",sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}
body{width:390px;overflow:hidden}
.hd{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#151a22;border-bottom:1px solid #252c38}
.hd img{height:28px;width:auto;display:block}.hd .nm{font-size:17px;font-weight:800;letter-spacing:-.02em;color:#e9edf3}
.hd .tag{font-size:12px;font-weight:600;color:#c0c7d2;border:1px solid #252c38;border-radius:999px;padding:3px 10px}
.hd .sp{flex:1}.hd .win{font-size:13px;font-weight:700;color:#e9edf3;background:#0c0f14;border:1px solid #252c38;border-radius:999px;padding:6px 12px}
.wrap{padding:16px 16px;display:grid;gap:16px;grid-template-columns:1fr;align-items:start}
.sec{background:#151a22;border-radius:16px;padding:18px 20px;display:grid;gap:4px}
.ttl{margin:0 0 6px;font-size:22px;font-weight:800;color:#e9edf3;letter-spacing:-.02em}.ttl small{font-size:13px;font-weight:600;color:#c0c7d2;margin-left:8px}
.row{display:grid;grid-template-columns:36px minmax(0,1fr);gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid #252c38}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:#0c0f14;color:#e9edf3;border:1px solid #252c38}
.who b{display:block;font-size:15px;font-weight:800;color:#e9edf3}.who small{font-size:12px;color:#c0c7d2}
.row .trk{grid-column:1/-1}
.trk{position:relative;height:30px;display:block;margin:0 12px}.trk__l,.trk__f{position:absolute;left:0;top:14px;height:4px;border-radius:2px}.trk__l{right:0}
.trk i{position:absolute;top:10px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid}
.trk b{position:absolute;top:6px;width:20px;height:20px;margin-left:-10px;border-radius:50%}
.det h3{margin:0;font-size:12px;font-weight:700;color:#8f99a9;letter-spacing:.04em}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:800;border-radius:999px;padding:4px 12px;border:1.5px dashed #f2c46b;color:#f2c46b;background:#33270f;justify-self:start}
.hist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}.hist li{border-left:2px solid #252c38;padding-left:12px}
.hist time{font-size:12px;color:#8f99a9}.hist p{margin:2px 0 0;font-size:14px;color:#e9edf3}.hist p b{font-weight:800}
.note{font-size:12px;color:#c0c7d2;padding:0 16px 20px}</style><header class="hd"><img src="../svg/ktr-symbol-dark.svg" alt=""><span class="nm">이적 레이더</span><span class="sp"></span><span class="win">2027 겨울</span></header>
<div class="wrap"><section class="sec"><p class="ttl">구단 A<small>영입 2</small></p><div class="row"><span class="av">한</span><span class="who"><b>한도윤</b><small>구단 B에서 영입</small></span><span class="trk"><span class="trk__l" style="background:#252c38"></span><span class="trk__f" style="width:50%;background:repeating-linear-gradient(90deg,#f2c46b 0 8px,transparent 8px 13px)"></span><i style="left:0%;background:#f2c46b;border-color:#f2c46b"></i><i style="left:25%;background:#f2c46b;border-color:#f2c46b"></i><i style="left:50%;background:#f2c46b;border-color:#f2c46b"></i><i style="left:75%;background:#151a22;border-color:#252c38"></i><i style="left:100%;background:#151a22;border-color:#252c38"></i><b style="left:50%;background:#f2c46b;box-shadow:0 0 0 6px #f2c46b33"></b></span></div><div class="row"><span class="av">서</span><span class="who"><b>서민재</b><small>구단 C에서 영입</small></span><span class="trk"><span class="trk__l" style="background:#252c38"></span><span class="trk__f" style="width:100%;background:#4cc77f"></span><i style="left:0%;background:#4cc77f;border-color:#4cc77f"></i><i style="left:25%;background:#4cc77f;border-color:#4cc77f"></i><i style="left:50%;background:#4cc77f;border-color:#4cc77f"></i><i style="left:75%;background:#4cc77f;border-color:#4cc77f"></i><i style="left:100%;background:#4cc77f;border-color:#4cc77f"></i><b style="left:100%;background:#4cc77f;box-shadow:0 0 0 6px #4cc77f33"></b></span></div></section>
</div>
