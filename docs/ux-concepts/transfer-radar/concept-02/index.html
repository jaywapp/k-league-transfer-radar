<!--
THESIS: 팬이 매일 묻는 질문은 "무엇이 바뀌었나"다. 첫 화면은 구단의 변화 기록이고, 현재 목록은 그 옆의 참고 자료다.
OWN-WORLD: 무채색 종이 위 송고 기록. 고정폭 숫자의 시각 열, 각진 모서리, 굵은 가로 괘선. 색은 상태 의미에만 쓴다.
STORY: 구단을 고르면 오늘·어제의 단계 변경과 새 주장을 위에서부터 읽고, 한 줄을 눌러 그 이적 건의 전체 타임라인을 따라간다.
FIRST VIEWPORT: 위 구단 띠, 왼쪽 넓은 변화 기록(날짜 묶음), 오른쪽 좁은 "지금 상태" 목록과 필터.
FORM: 날짜별 변화 기록 + 타임라인 상세(전체 화면). 모바일은 변화 기록/지금 상태 전환.
-->
